name: Build Amar Business Hisab Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Debug APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Prepare APK
        run: |
          mkdir -p release_output
          APK_FILE=$(find . -name "*debug*.apk" -type f | head -n 1)
          cp "$APK_FILE" release_output/AmarBusinessHisab-v1.0.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarBusinessHisab-Debug-APK
          path: release_output/AmarBusinessHisab-v1.0.0-debug.apk
